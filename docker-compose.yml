version: "3.8"

services:
  web:
    build: .
    container_name: identificador-flores
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://host.docker.internal:11434
      - DJANGO_DB_PATH=/data/db.sqlite3
    volumes:
      # ":z" ajusta o rótulo SELinux (Fedora/RHEL);
      - .:/app:z
      - db_data:/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
